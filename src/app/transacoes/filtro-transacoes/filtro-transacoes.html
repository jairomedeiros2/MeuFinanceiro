<div class="modal fade" id="modalFiltroTransacoes" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-slideout">
    <div class="modal-content border-0 h-100 rounded-start-4 shadow">

      <!-- Cabeçalho -->
      <div class="modal-header border-0 px-4 pt-4 pb-2">
        <h5 class="modal-title fw-bold text-dark fs-5">Filtro de transações</h5>
      </div>

      <!-- Abas (Novo Filtro / Filtros Salvos) -->
      <ul class="nav nav-tabs border-bottom px-4" id="filtroTabs" role="tablist">
        <li class="nav-item flex-grow-1 text-center" role="presentation">
          <button class="nav-link active w-100 fw-semibold text-uppercase py-2" id="novo-tab" data-bs-toggle="tab" type="button" role="tab">Novo Filtro</button>
        </li>
        <li class="nav-item flex-grow-1 text-center" role="presentation">
          <button class="nav-link w-100 fw-semibold text-uppercase py-2 text-muted" id="salvos-tab" data-bs-toggle="tab" type="button" role="tab">Filtros Salvos</button>
        </li>
      </ul>

      <!-- Corpo do Formulário -->
      <div class="modal-body px-4 py-3 overflow-auto">
        <form>
          <!-- Filtro de Contas -->
          <div class="mb-4">
  <label class="form-label text-muted small mb-1">Contas</label>
  <div class="input-tag-container d-flex align-items-center justify-content-between p-2 rounded-3 border">
    <div class="d-flex flex-wrap gap-1">
      @if (svc.filtrosAtivos().conta) {
        <span class="badge badge-purple-tag d-flex align-items-center gap-2">
          {{ svc.filtrosAtivos().conta }}
          <i class="bi bi-x-circle-fill cursor-pointer text-muted-hover" (click)="svc.limparFiltro('conta')"></i>
        </span>
      }
    </div>
    <i class="bi bi-chevron-down text-muted"></i>
  </div>
</div>
          <!-- <div class="mb-4">
            <label class="form-label text-muted small mb-1">Contas</label>
            <div class="input-tag-container d-flex align-items-center justify-content-between p-2 rounded-3 border">
              <span class="badge badge-purple-tag d-flex align-items-center gap-2">
                <span class="mini-logo-nu">nu</span> Nuconta
                <i class="bi bi-x-circle-fill cursor-pointer"></i>
              </span>
              <i class="bi bi-chevron-down text-muted"></i>
            </div>
          </div> -->

          <!-- Filtro de Tags -->
          <div class="mb-4">
            <label class="form-label text-muted small mb-1">Tags</label>
            <div class="input-tag-container d-flex align-items-center justify-content-between p-2 rounded-3 border">
              <span class="badge badge-gray-tag d-flex align-items-center gap-2">
                fortaleza <i class="bi bi-x-circle-fill cursor-pointer"></i>
              </span>
              <i class="bi bi-chevron-down text-muted"></i>
            </div>
          </div>

          <!-- Filtro de Situações -->
          <div class="mb-4">
  <label class="form-label text-muted small mb-1">Situações</label>
  <div class="input-tag-container d-flex align-items-center justify-content-between p-2 rounded-3 border">
    <div class="d-flex flex-wrap gap-1">
      @if (svc.filtrosAtivos().situacao) {
        <span class="badge badge-gray-tag d-flex align-items-center gap-2">
          {{ svc.filtrosAtivos().situacao }}
          <i class="bi bi-x-circle-fill cursor-pointer text-muted-hover" (click)="svc.limparFiltro('situacao')"></i>
        </span>
      }
    </div>
    <i class="bi bi-chevron-down text-muted"></i>
  </div>
</div>

          <!-- Filtro de Tipos -->
          <div class="mb-4">
            <label class="form-label text-muted small mb-1">Tipos</label>
            <div class="input-tag-container d-flex align-items-center justify-content-between p-2 rounded-3 border">
              <span class="badge badge-gray-tag d-flex align-items-center gap-2">
                Despesas <i class="bi bi-x-circle-fill cursor-pointer"></i>
              </span>
              <i class="bi bi-chevron-down text-muted"></i>
            </div>
          </div>

          <!-- Período de Datas (De / Até) -->
          <div class="row g-3 mb-4">
            <div class="col-6">
              <label class="form-label text-muted small mb-1">De</label>
              <input type="date" name="dataInicio" [(ngModel)]="filtros.dataInicio" class="form-control border-0 border-bottom rounded-0 px-0 shadow-none text-secondary">
            </div>
            <div class="col-6">
              <label class="form-label text-muted small mb-1">Até</label>
              <input type="date" name="dataFim" [(ngModel)]="filtros.dataFim" class="form-control border-0 border-bottom rounded-0 px-0 shadow-none text-secondary">
            </div>
          </div>

          <!-- Switch Salvar Personalizado -->
          <div class="d-flex justify-content-between align-items-center pt-2">
            <span class="text-secondary small">Salvar filtro personalizado</span>
            <div class="form-check form-switch m-0">
              <input class="form-check-input switch-blue shadow-none cursor-pointer" type="checkbox" name="salvar" [(ngModel)]="salvarPersonalizado">
            </div>
          </div>
        </form>
      </div>

      <!-- Rodapé / Botões -->
      <div class="modal-footer border-0 px-4 pb-4 pt-2 d-flex justify-content-between">
        <button type="button" class="btn btn-link text-secondary fw-semibold text-decoration-none px-0 shadow-none" data-bs-dismiss="modal">CANCELAR</button>
        <button type="button" (click)="aplicarFiltro()" class="btn btn-aplicar text-white fw-semibold rounded-pill px-4 shadow-none">
          APLICAR FILTRO
        </button>
      </div>

    </div>
  </div>
</div>
